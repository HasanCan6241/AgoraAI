# PATH: pytest.ini
# Agora AI — pytest Konfigürasyonu
# Doküman Bölüm 2.4 ve AŞAMA 9: pytest + pytest-django

[pytest]
DJANGO_SETTINGS_MODULE = config.settings.development
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
markers =
    unit: Birim testleri
    integration: Entegrasyon testleri
    slow: Yavaş çalışan testler (API çağrıları vb.)
