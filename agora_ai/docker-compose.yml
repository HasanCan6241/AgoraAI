# PATH: docker-compose.yml
# Agora AI — Docker Compose Konfigürasyonu
# Doküman Bölüm 2.4: Docker + Docker Compose — Yerel geliştirme ve üretim
# Servisler: db (PostgreSQL 16), redis (7), web (Django), celery (worker)

version: "3.9"

services:
  # ── PostgreSQL Veritabanı ────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: agora_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-agora_ai}
      POSTGRES_USER: ${DB_USER:-agora_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-agora_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-agora_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (Cache + Message Broker) ──────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: agora_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Django Web Uygulaması ────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agora_web
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --settings=config.settings.development &&
             python manage.py collectstatic --noinput --settings=config.settings.development &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120"
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - chroma_data:/data/chromadb
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Celery Worker (Arka Plan Görevleri) ─────────────────────────────────
  celery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agora_celery
    restart: unless-stopped
    command: celery -A config worker -l info --concurrency 2
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
    volumes:
      - .:/app
      - media_volume:/app/media
      - chroma_data:/data/chromadb
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Celery Beat (Periyodik Görevler — İleride kullanım için) ────────────
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agora_celery_beat
    restart: unless-stopped
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Nginx (Ters Proxy + Statik Dosya Sunucu) ─────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: agora_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - web

# ── Kalıcı Depolama Alanları ──────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local
  chroma_data:
    # ChromaDB persistence — Doküman Bölüm 7.4
    driver: local
