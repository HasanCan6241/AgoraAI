# PATH: nginx/nginx.conf
# Agora AI — Nginx Konfigürasyonu
# Doküman Bölüm 2.4 ve AŞAMA 9: Nginx — ters proxy, statik dosya sunumu

upstream agora_django {
    server web:8000;
}

server {
    listen 80;
    server_name localhost;

    # Maksimum istek boyutu (PDF yükleme için — Doküman Bölüm 7.4: 50MB)
    client_max_body_size 55M;

    # ── Statik Dosyalar (Django staticfiles) ──────────────────────────────
    location /static/ {
        alias /app/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Medya Dosyaları (Yüklenen PDF'ler vb.) ───────────────────────────
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
        # Güvenlik: PHP/CGI çalıştırılmasını engelle
        location ~* \.(php|pl|py|rb)$ {
            deny all;
        }
    }

    # ── SSE (Server-Sent Events) Streaming ───────────────────────────────
    # Doküman Bölüm 5.3: Gemini streaming yanıtları için proxy ayarı
    location /conversations/ {
        proxy_pass http://agora_django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE için kritik ayarlar — Doküman Bölüm 2.2
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    location /symposium/ {
        proxy_pass http://agora_django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # ── Genel Django Proxy ────────────────────────────────────────────────
    location / {
        proxy_pass http://agora_django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # ── Gzip Sıkıştırma ───────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # ── Güvenlik Başlıkları ───────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
