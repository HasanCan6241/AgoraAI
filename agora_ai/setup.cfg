# PATH: setup.cfg
# Agora AI — Kod Kalitesi Araçları Konfigürasyonu
# Doküman Bölüm 2.4: Black + isort + flake8

[flake8]
max-line-length = 88
extend-ignore = E203, E266, W503
exclude =
    .git,
    __pycache__,
    .venv,
    venv,
    migrations,
    staticfiles,
    media,
    node_modules

[isort]
profile = black
multi_line_output = 3
include_trailing_comma = True
force_grid_wrap = 0
use_parentheses = True
line_length = 88
known_django = django
known_first_party = apps, config
sections = FUTURE, STDLIB, THIRDPARTY, DJANGO, FIRSTPARTY, LOCALFOLDER
skip = migrations, .venv, venv

[tool:pytest]
DJANGO_SETTINGS_MODULE = config.settings.development
